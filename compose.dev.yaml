# Nextup OSS local development overlay. Use only through:
#   python3 scripts/local.py --env dev <doctor|start|debug|status|stop|migrate>
# Identity values below are literals on purpose: no environment variable can point this
# stack at another project, volume, image, database, role or cluster. `.env.dev` (created
# by the launcher, mode 0600) supplies only non-secret values: the instance ID, loopback
# host ports, the local UID/GID and tunables. Secrets are files under .secrets/dev/
# (directory 0700, files 0600, generated by the launcher, never copied from elsewhere).
name: nextup-oss-dev

x-dev-env: &dev-env
  NEXTUP_ENV: dev
  NEXTUP_INSTANCE_ID: ${NEXTUP_DEV_INSTANCE_ID:?Run python3 scripts/local.py --env dev start to create .env.dev}
  NEXTUP_DB_NAME: nextup_dev
  NEXTUP_DIAGNOSTIC_INTERVAL_SECONDS: ${NEXTUP_DEV_DIAGNOSTIC_INTERVAL_SECONDS:-60}
  NEXTUP_JOB_FETCH_MIN_INTERVAL_SECONDS: ${NEXTUP_DEV_JOB_FETCH_MIN_INTERVAL_SECONDS:-60}
  NEXTUP_JOB_RETENTION_DAYS: ${NEXTUP_DEV_JOB_RETENTION_DAYS:-30}
  NEXTUP_TASK_HISTORY_CLEANUP_ENABLED: ${NEXTUP_DEV_TASK_HISTORY_CLEANUP_ENABLED:-false}
  NEXTUP_TASK_HISTORY_RETENTION_DAYS: ${NEXTUP_DEV_TASK_HISTORY_RETENTION_DAYS:-30}
  NEXTUP_TASK_HISTORY_BATCH_SIZE: ${NEXTUP_DEV_TASK_HISTORY_BATCH_SIZE:-100}

x-dev-runtime: &dev-runtime
  image: nextup-oss-dev/backend:local
  # Same UID/GID as the launcher that generated the 0600 secret files.
  user: '${NEXTUP_DEV_LOCAL_UID:?Run python3 scripts/local.py --env dev start}:${NEXTUP_DEV_LOCAL_GID:?Run python3 scripts/local.py --env dev start}'
  restart: 'no'
  environment: &dev-runtime-env
    <<: *dev-env
    NEXTUP_DB_USER: nextup_dev_app
    NEXTUP_DB_PASSWORD_FILE: /run/secrets/db_app_password
  secrets: [db_app_password]

services:
  postgres:
    command: [postgres, -c, cluster_name=nextup-oss-dev]
    environment:
      POSTGRES_USER: nextup_dev_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password, db_owner_password, db_app_password]
  migrate:
    image: nextup-oss-dev/backend:local
    user: '${NEXTUP_DEV_LOCAL_UID:?Run python3 scripts/local.py --env dev start}:${NEXTUP_DEV_LOCAL_GID:?Run python3 scripts/local.py --env dev start}'
    environment:
      <<: *dev-env
      NEXTUP_DB_ROLE: migrator
      NEXTUP_DB_USER: nextup_dev_owner
      NEXTUP_DB_PASSWORD_FILE: /run/secrets/db_owner_password
      NEXTUP_MIGRATION_KEY_FILE: /run/secrets/migration_key
    secrets: [db_owner_password, migration_key]
  api:
    <<: *dev-runtime
    # Only the api verifies the local-session setup code, so only it receives the file.
    environment:
      <<: *dev-runtime-env
      NEXTUP_SETUP_CODE_FILE: /run/secrets/setup_code
    secrets: [db_app_password, setup_code]
    ports:
      - 127.0.0.1:${NEXTUP_DEV_API_PORT:-18000}:8000
  worker:
    <<: *dev-runtime
  scheduler:
    <<: *dev-runtime
  frontend:
    image: nextup-oss-dev/frontend:local
    ports:
      - 127.0.0.1:${NEXTUP_DEV_FRONTEND_PORT:-15173}:5173
  e2e:
    image: nextup-oss-dev/e2e:local
    profiles: [test]
    user: '${NEXTUP_DEV_LOCAL_UID:-1000}:${NEXTUP_DEV_LOCAL_GID:-1000}'
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    init: true
    environment:
      E2E_BASE_URL: http://frontend:5173
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - ./frontend/test-results:/app/test-results
    depends_on:
      frontend:
        condition: service_healthy

secrets:
  db_admin_password:
    file: ./.secrets/dev/db_admin_password
  db_owner_password:
    file: ./.secrets/dev/db_owner_password
  db_app_password:
    file: ./.secrets/dev/db_app_password
  migration_key:
    file: ./.secrets/dev/migration_key
  setup_code:
    file: ./.secrets/dev/setup_code

volumes:
  postgres-data:
    name: nextup-oss-dev_postgres-data
  redis-data:
    name: nextup-oss-dev_redis-data
  scheduler-data:
    name: nextup-oss-dev_scheduler-data
