name: Nextup CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextup-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-30
        with:
          persist-credentials: false
      - name: Verify isolated stack
        # The hosted runner is itself disposable; local runs must opt in explicitly.
        env:
          NEXTUP_INTEGRATION_APPROVED: '1'
        run: python3 scripts/verify_ci.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextup-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci/
          retention-days: 7
          if-no-files-found: warn
